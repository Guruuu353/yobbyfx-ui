server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # the app calls /api/...; strip the prefix and hand it to the backend container (also what MT5's EA uses: https://your-domain/api)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
